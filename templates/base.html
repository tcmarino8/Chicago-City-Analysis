<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title or "Chicago AQI Sensor Network" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; color: #222; }
      body.dark-shell { background: #070b13; color: #e7ebf3; }
      header { background: #111; color: #fff; padding: 1.5rem; }
      header h1 { margin: 0 0 0.5rem 0; font-size: 1.75rem; }
      nav a { color: #ddd; margin-right: 1rem; text-decoration: none; font-weight: 600; }
      nav a:hover { color: #fff; }
      main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem 3rem; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.08); border-radius: 8px; }
      .full-bleed main {
        max-width: none;
        margin: 0;
        padding: 0;
        background: transparent;
        box-shadow: none;
        border-radius: 0;
      }
      h2 { margin-top: 0; }
      .control-row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
      .control-row label { display: flex; flex-direction: column; font-size: 0.9rem; font-weight: 600; color: #333; }
      .control-row select,
      .control-row input { padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 4px; min-width: 150px; font-size: 0.95rem; }
      .plot { margin-bottom: 1.5rem; }
      ul { padding-left: 1.2rem; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
      th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
      th { background: #f0f0f0; }
      .message { padding: 1rem; background: #fff7e6; border: 1px solid #f0c36d; border-radius: 4px; margin-bottom: 1.5rem; }
      button { padding: 0.6rem 1.2rem; border: none; background: #0050ef; color: #fff; font-weight: 600; border-radius: 4px; cursor: pointer; }
      button:hover { background: #003cb8; }

      .workspace-shell {
        position: relative;
        min-height: calc(100vh - 120px);
        background: #070b13;
      }
      .workspace-controls {
        position: absolute;
        z-index: 20;
        top: 62px;
        left: 14px;
        right: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        border-radius: 10px;
        background: rgba(8, 14, 24, 0.76);
        backdrop-filter: blur(4px);
        opacity: 1;
        transform: translateY(0);
        transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
      }
      .workspace-controls.is-collapsed { opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-8px); }
      .workspace-tabbar {
        position: absolute;
        z-index: 24;
        top: 12px;
        left: 14px;
        right: 14px;
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 40px;
        padding: 5px 6px;
        overflow-x: auto;
        border: 1px solid #263751;
        border-radius: 10px;
        background: rgba(8, 14, 24, 0.9);
        box-shadow: 0 6px 24px rgba(0,0,0,.2);
        backdrop-filter: blur(10px);
        scrollbar-width: none;
      }
      .workspace-tabbar::-webkit-scrollbar { display: none; }
      .workspace-tabbar .tab-divider { width: 1px; align-self: stretch; flex: 0 0 1px; background: #30405a; }
      .workspace-tabbar .mode-switch { flex: 0 0 auto; }
      .workspace-tabbar .mode-btn,
      .workspace-tabbar .filter-toggle {
        white-space: nowrap;
        border: 0;
        border-radius: 7px;
        padding: .42rem .65rem;
        background: transparent;
        color: #aebbd0;
        font-size: .78rem;
      }
      .workspace-tabbar .mode-btn:hover,
      .workspace-tabbar .filter-toggle:hover { background: rgba(47,140,255,.14); color: #fff; }
      .workspace-tabbar .mode-btn.active { background: #2f8cff; color: #fff; }
      .workspace-tabbar .filter-toggle { border: 1px solid #3b4c68; }
      .workspace-tabbar .filter-toggle.right { margin-left: auto; }
      .workspace-tabbar .filter-toggle[aria-expanded="true"] { background: rgba(47,140,255,.18); color: #fff; }
      .tab-menu-panel {
        position: absolute;
        z-index: 25;
        top: 56px;
        left: 14px;
        right: 14px;
        border: 1px solid #2f405c;
        border-radius: 10px;
        background: rgba(7, 12, 21, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        padding: 8px;
        display: none;
      }
      .tab-menu-panel.is-open { display: block; }
      .tab-menu-panel .menu-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tab-menu-panel .menu-row + .menu-row {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #2a3a53;
      }
      .tab-menu-panel .menu-label {
        width: 100%;
        font-size: .72rem;
        color: #9ba8bf;
        font-weight: 700;
        letter-spacing: .04em;
        text-transform: uppercase;
        margin-bottom: 2px;
      }
      .workspace-controls .control-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 130px;
      }
      .workspace-controls .control-group.compact { min-width: 86px; max-width: 100px; }
      .workspace-controls label { font-size: 0.75rem; color: #d9deea; font-weight: 600; letter-spacing: 0.02em; }
      .workspace-controls select,
      .workspace-controls input {
        background: rgba(21, 30, 44, 0.95);
        border: 1px solid #30405a;
        color: #eef2f9;
        border-radius: 6px;
        padding: 0.38rem 0.48rem;
      }
      .map-stage { position: relative; width: 100%; height: calc(100vh - 120px); }
      .workspace-map { width: 100%; height: 100%; }
      .mode-switch { display: flex; align-items: center; gap: 4px; }
      .mode-btn, .arrow-btn {
        background: rgba(29, 43, 63, 0.96);
        border: 1px solid #3b4c68;
        color: #e7ebf3;
        border-radius: 7px;
        padding: 0.4rem 0.55rem;
      }
      .mode-btn.active { background: #2f8cff; border-color: #2f8cff; color: #fff; }
      .overlay-panel {
        position: absolute;
        right: 14px;
        top: 92px;
        width: min(340px, calc(100vw - 28px));
        max-height: calc(100vh - 220px);
        overflow: auto;
        border-radius: 10px;
        background: rgba(8, 14, 24, 0.78);
        color: #e7ebf3;
        border: 1px solid #2f405c;
        padding: 12px;
        z-index: 20;
      }
      .overlay-panel.is-hidden { display: none; }
      .overlay-panel h3 { margin: 0 0 6px 0; font-size: 1rem; }
      .overlay-time { margin: 0 0 8px 0; color: #b9c4d9; font-size: 0.83rem; }
      .overlay-panel ul { margin: 0; padding-left: 1rem; }
      .overlay-panel li { margin-bottom: 0.25rem; }
      .overlay-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .data-status { display: inline-flex; align-items: center; gap: 5px; margin-bottom: 8px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
      .data-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #98a2b3; }
      .data-status.good::before { background: #37d67a; box-shadow: 0 0 8px rgba(55,214,122,.55); }
      .data-status.warning::before { background: #ffb020; }
      .report-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0 12px; }
      .report-kpi { min-width: 0; padding: 9px; border: 1px solid #293b58; border-radius: 8px; background: rgba(20,31,47,.8); }
      .report-kpi__label { color: #9eabc1; font-size: .68rem; line-height: 1.25; }
      .report-kpi__value { margin-top: 3px; color: #f7f9fc; font-size: 1.15rem; font-weight: 750; }
      .report-kpi__detail { margin-left: 4px; color: #aab5c8; font-size: .68rem; }
      .report-kpi.warning { border-color: rgba(255,176,32,.48); }
      .report-kpi.good .report-kpi__value { color: #70e3a3; }
      .report-kpi.accent .report-kpi__value { color: #6eb3ff; }
      .report-trend { height: 112px; margin: 4px -4px 8px; }
      .workspace-updating { opacity: .62; pointer-events: none; }
      .mode-side-panel {
        position: absolute;
        right: 14px;
        top: 14px;
        width: 300px;
        border-radius: 10px;
        background: rgba(8, 14, 24, 0.84);
        color: #e7ebf3;
        border: 1px solid #2f405c;
        padding: 12px;
        z-index: 21;
      }
      .mode-side-panel__section h4 {
        margin: 0 0 10px 0;
        font-size: 0.95rem;
      }
      .mode-side-panel__section label {
        display: block;
        font-size: 0.76rem;
        color: #d9deea;
        margin-bottom: 4px;
        margin-top: 8px;
      }
      .mode-side-panel__section select {
        width: 100%;
        background: rgba(21, 30, 44, 0.95);
        border: 1px solid #30405a;
        color: #eef2f9;
        border-radius: 6px;
        padding: 0.38rem 0.48rem;
      }
      .mode-side-panel__section button {
        margin-top: 10px;
        width: 100%;
      }
      .info-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        margin-left: 4px;
        font-size: 10px;
        background: #29486f;
        color: #fff;
        cursor: pointer;
      }
      .help-popover {
        position: absolute;
        z-index: 30;
        max-width: 260px;
        border: 1px solid #3c4f70;
        border-radius: 8px;
        background: rgba(6, 10, 18, 0.95);
        color: #ecf1f9;
        padding: 8px 10px;
        font-size: 0.8rem;
        line-height: 1.3;
      }
      .floating-message {
        position: absolute;
        bottom: 14px;
        left: 14px;
        z-index: 30;
      }
      @media (max-width: 780px) {
        header { padding: 1rem; }
        header h1 { font-size: 1.25rem; }
        nav a { font-size: .85rem; }
        .workspace-tabbar { position: relative; inset: auto; border-radius: 0; border-left: 0; border-right: 0; }
        .workspace-tabbar .mode-btn,
        .workspace-tabbar .filter-toggle { font-size: .74rem; padding: .42rem .55rem; }
        .tab-menu-panel { position: relative; inset: auto; border-radius: 0; border-left: 0; border-right: 0; border-top: 0; }
        .workspace-controls { position: relative; inset: auto; max-height: 42vh; overflow-y: auto; border-radius: 0; }
        .workspace-controls.is-collapsed { display: none; }
        .workspace-controls .control-group { min-width: 110px; flex: 1 1 130px; }
        .map-stage { height: 72dvh; min-height: 430px; }
        .overlay-panel { top: auto; bottom: 12px; right: 12px; left: 12px; width: auto; max-height: 44%; }
        .report-trend { display: none; }
        .mode-switch { flex-wrap: wrap; }
        .floating-message { right: 14px; }
      }
    </style>
  </head>
  <body class="{% if full_bleed %}dark-shell full-bleed{% endif %}">
    <header>
      <h1>Chicago AQI Sensor Network</h1>
      <nav>
        {% for label, endpoint in nav_links %}
          <a href="{{ url_for(endpoint) }}">{{ label }}</a>
        {% endfor %}
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
