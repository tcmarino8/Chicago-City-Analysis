                var html_39bb2b0772a55b2769bfe56cf936df4c = $(`<div id="html_39bb2b0772a55b2769bfe56cf936df4c" style="width: 100.0%; height: 100.0%;">     <b>The Dearborn</b><br>     <b>Date:</b> 2026-05-23<br><br>     I’ve never written a review specifically for the contribution of the desire for a restaurant to succeed during these unstable financial times but this is it ⭐️⭐️⭐️⭐️⭐️and I give permission for my review to be used in a testimonial 😊  To start off, I almost removed a star for atmosphere because the 5/22/2016 private bridal party on the upper level treated the accessible bathroom as their private bathroom and my friend in a wheelchair had to wait for the women who used it as such to leave despite all the stalls in the regular women’s  bathroom two doors down being fully available. It wasn’t the restaurants fault, it was the fault of the lack of awareness of the bridal party that other people besides them would need the bathroom. Thank you to the gentleman who apologized on their behalf for their ignorance. Thank you also for the waitress that showed us how to use the manual elevator to get to the bathroom and waited for us at that level to guide us to the bathroom that was occupied.  My friend and I spilt a bottle of Italian wine 🍷 to toast our upcoming vacation, as well as some delicious fries. The fries I think were hand cut and well cooked, we both wished the serving was bigger! The barista let us taste a wine before we decided to split a different bottle, excellent service! She also refilled our glasses throughout our evening, and another bartender refilled our water. We were very well attended to 🥂  I smelled the curry chicken dish from the gentleman sitting next to me and it smelled divine 😍 then the woman next to my friend ordered the same thing and my friend whose ex husband is South Asian said it smelled just like what he used to make for dinner. I tried to get the ingredients to no avail lol. I will definitely order a vegan/vegetarian version the next time 😋  I ordered a fish and chips to go for my doorman because the menu said it beat a famous chef’s recipe and he loves fish and chips. He agreed it was the best he’s ever had! He said he will be coming for dinner very soon 👌🏾  I’m moving across the country next week but I’m so grateful I got to experience The Dearborn. I look forward to to dining here again when I come back home 🫶🏾     </div>`)[0];

                var html_ae8fb4c95761b6b31e33119c7654b95a = $(`<div id="html_ae8fb4c95761b6b31e33119c7654b95a" style="width: 100.0%; height: 100.0%;">     <b>Alla Vita</b><br>     <b>Date:</b> 2025-11-27<br><br>     We came on a Monday and made reservations in advanced to sit outside. In the warmer months, they have a cute patio. When that patio is closed, you still get to enjoy a beautifully decorated and chic interior. We were sat quickly and we started off with the marinated olives, the arancini and a salad. The olives had a rosemary olive oil, and had a generous amount of olives in the platter. The arancini were small but they were dense, and melted in your mouth. The marinated pork inside was creamy and paired well with the aioli sauce they served alongside them. We got the alla vita chopped salad and boy, it was full of life! The ingredients were vibrant, and had a nice distribution among everything. For my entree I got the ricotta dumplings, and I would be lying if I didn’t say I initially was skeptical when I saw the portion size but quickly was reassured. These dumplings are dense and absolutely delicious. The cacio e pepe was like a pillow, doused in a warm buttery sauce and the creamy ricotta had me savoring every bite. My partner got the rigatoni vodka pasta and her dish was wonderful too. My biggest issue was we waited a bit to  order, but the food came quickly after we had ordered. Our allergies were easily accommodated as well. What really makes this place special is the amount of love and care that gets put into their homemade pasta and dishes, and it is absolutely worth every penny.     </div>`)[0];

                var html_6cb4df51981e352d6885a3f55f18d21f = $(`<div id="html_6cb4df51981e352d6885a3f55f18d21f" style="width: 100.0%; height: 100.0%;">     <b>Alla Vita</b><br>     <b>Date:</b> 2026-02-23<br><br>     Allavita was the very first restaurant we visited after landing home from Rome last spring… and somehow the experience didn’t end at the airport. The flavors, the music, and the warm ambience felt like Italy had followed us back to Chicago. We absolutely fell in love with it.  On our first visit, Lanthan welcomed us immediately and graciously found us a table even without a reservation — a kindness we still remember.  Since then, we’ve returned often to explore different dishes and are never disappointed.  One of the most memorable was the carne crudo — unbelievably beautiful and served with delicate little pillows of dough you could gently crack open or fold around the tartare. Thoughtful, refined, and completely joyful to eat.  These are the kinds of dinners that make you excited about life — and about chefs who still manage to surprise you.  General Managers Nicole and Jo have been incredibly warm and gracious, and servers Jo and Oscar make every visit feel special and welcoming. The entire team consistently guides us to wonderful choices on the menu.  Allavita isn’t just a great meal — it’s an experience we genuinely look forward to again and again.     </div>`)[0];

                var html_7c3fda32c228c2b500c8bf24f5c7b57a = $(`<div id="html_7c3fda32c228c2b500c8bf24f5c7b57a" style="width: 100.0%; height: 100.0%;">     <b>Alla Vita</b><br>     <b>Date:</b> 2026-01-17<br><br>     Alla Vita is such a great spot in the West Loop. The ambiance alone makes it worth visiting. The space feels intimate and thoughtfully designed, with warm Edison bulb lighting, greenery, and beautiful ceiling details that give the restaurant a cozy but elevated feel. On both of my visits, service was excellent throughout the meal. Everything came out quickly, and the staff checked in on us multiple times to make sure we had everything we needed without ever feeling rushed. Food-wise, both pasta dishes we ordered were outstanding. The squash sacchetti was delicate and flavorful, with a really nice balance that didn’t feel heavy. The brown butter sauce really added to the dish. The cacio e pepe gnocchi was rich, comforting, and perfectly executed. Overall, Alla Vita delivered on food, service, and atmosphere. It’s an easy place to recommend for a date night or a special dinner where you want great pasta in a beautiful setting. Just remember a reservation, they get pretty busy.     </div>`)[0];

                var html_2d71803e97f96d84cc5c5a51cccac928 = $(`<div id="html_2d71803e97f96d84cc5c5a51cccac928" style="width: 100.0%; height: 100.0%;">     <b>The Purple Pig Restaurant</b><br>     <b>Date:</b> 2026-04-30<br><br>     Wow this is one of the best restaurants we ever been. If you are in Chicago Downtown you must have dinner at the Purple Pig.  We ate a lot, we order some stuff but the Executive chef came to our place at the bar and we were talking and he offered more dishes on the house… and everything was AMAZING!!  First we order Roasted Piquillo Peppers, they were really good, and not hot at all, so if you are not a mexican, don’t have to worry about how hot it was.  Then we ordered Crispy Pig’s Ear, it was a combination of Kale, Pickled Peppers + Fried Egg… wow what a creative combination, and what a taste… you must try it!!!  After that we had Salt-Roasted Beets with Crumbled Goat Cheese  and Pistachio Butter…this was the best pistachio I ever taste… the Pistachio butter was wonderful… and in combination with the Roasted Beets… UFFFF the amazing taste.  Then the chef got to us another dish, not in the menu, or at least I don’t remember it. It was a pair of tapas with homemade morcilla. The morcilla was amazing too, they should include that in the menu very soon.  The final dish was the pasta Agnolotti… but for me it was cannelloni filled with Beef Short Rib and covered with Bone Marrow and Brown Butter. At this point we were 100% full but we sacrifice our self and ate it… and it completely worth it.  Dessert… of course, why not… so we got Chocolate Sponge Cake  with Roasted Almond Sauce + Shaved Almonds, and chef didn’t let us go without having the Orange Coconut Panna Cotta… oh my God, both were wonderful, but we couldn’t finish them.  Check the pictures…     </div>`)[0];

                var html_931ede8cf8d045dca39b27f2b54f2691 = $(`<div id="html_931ede8cf8d045dca39b27f2b54f2691" style="width: 100.0%; height: 100.0%;">     <b>The Purple Pig Restaurant</b><br>     <b>Date:</b> 2026-01-30<br><br>     Great experience. My bf had highly recommended this to me based on the last time he came here (when it was at the old location). Good service. Nice interior. The food was mostly all delicious. The beets appetizer was recommended by the server. I'm not really into beets but surprisingly this was super good. The beets were soft. Paired well with the cheese and peanut butter. Interesting combos that I wouldve never thought of but it works! The pork tongue was good too. Mushroom risotto was a great entrees! Filled with scallops and mushrooms. Delicious and simple. The pork shoulder was another recommendation by the server. It was good, but bf and I enjoyed the mushroom risotto more. The pork shoulder was a bit heavy and the sauce was a bit salty for our personal taste. Saw the table next to us get apple cobbler and it looked so good that we had to get one also. It was so delicious! The pipping hot apple cobbler with the melty cinnamon ice cream. Great meal.     </div>`)[0];

                var html_ee01be2848ad3a3508c176bc11b06a0f = $(`<div id="html_ee01be2848ad3a3508c176bc11b06a0f" style="width: 100.0%; height: 100.0%;">     <b>AMBAR Restaurant, Chicago</b><br>     <b>Date:</b> 2026-02-19<br><br>     I visited Ambar Restaurant Chicago and overall had a very pleasant experience. The atmosphere was cozy, the service was excellent, and our server was incredibly kind and attentive. We ordered the Unlimited Ambar Experience, which is a great way to try many dishes in smaller portions. While waiting for the food, we started with Turkish coffee, and the first bites — Kajmak with homemade bread, sirnica, and meat pie — were fantastic. I have to say, this was the best kajmak I’ve had since moving to the U.S. The rest of the dishes came out quickly. The beef soup was flavorful, although a bit heavy on the black pepper. The ćevapi had great taste but could’ve used an extra minute or two on the grill, as they were slightly undercooked in the middle. They were also served with a spicy feta spread, which is creative but not the traditional pairing. The meat pie was a bit dry. We also tried the Krempita for dessert. As a baker with a refined palate for desserts, I tend to notice these details, and while it was pleasant, our server shared that it is not house-made and comes from a local store. I was a bit disappointed, as I expected a homemade dessert to better reflect the restaurant’s otherwise strong and authentic culinary concept. Overall, I enjoyed my visit, and the quality ingredients and concept stand out. My only suggestion is to keep traditional dishes closer to their original form — Balkan food shines the most when it stays authentic. Still, I would definitely come back and try more dishes!     </div>`)[0];

                var html_8867f3299e0c305e5e3946d22f99679c = $(`<div id="html_8867f3299e0c305e5e3946d22f99679c" style="width: 100.0%; height: 100.0%;">     <b>Elephant & Castle</b><br>     <b>Date:</b> 2026-04-14<br><br>     We visited Elephant & Castle during our trip to Chicago and tried a few different dishes. Overall, it’s a lively pub-style restaurant with a casual, high-energy atmosphere.  We started with the hummus, which had a balsamic drizzle that added a subtle sweetness. It was served with naan, celery, carrots, and cucumbers. Everything was fresh and a nice way to start the meal.  For mains, we had the fish and chips and the Wee Pie Flight. The fish and chips were crispy and fresh, paired well with tartar sauce and lemon for extra flavor.  The Wee Pie Flight included shepherd’s pie, chicken pot pie, steak and mushroom, and cheesy leek and potato. My ranking from favorite to least favorite was shepherd’s pie, chicken pot pie, steak and mushroom, and cheesy leek and potato. All were enjoyable, with the cheesy leek and potato being the mildest in flavor.  Service was good. Staff checked in often and were attentive throughout the meal.  One thing to note is that the restaurant is very loud, so it may not be ideal for those sensitive to noise or sensory overload.  Overall, the food was good and the experience was enjoyable, but not particularly standout.  Would I go back? Maybe… but only if I’m mentally prepared for the volume.  Overall rating: 3.5 out of 5 stars ⭐⭐⭐✨     </div>`)[0];

                var html_b252a0dce4d95d3db17d063a335004ae = $(`<div id="html_b252a0dce4d95d3db17d063a335004ae" style="width: 100.0%; height: 100.0%;">     <b>Beatnik On The River</b><br>     <b>Date:</b> 2026-05-27<br><br>     Hands-down, this might have been the restaurant I was most looking forward to on my trip to Chicago. So many of the videos I watched and the posts I saw mentioned it as want to go to. I snagged a reservation a week or so before I left and I am so glad I did. I love restaurants that not only put out amazing food, but also transport you to a completely different place. The vibes of this restaurant. The details. The decor. And especially the food make this one that I will continue recommending to people. I was a little bummed that the lower level with the hanging flowers wasn’t wheelchair accessible, but I was impressed that as soon as I rolled up, the staff immediately got a portable ramp to put up so I could access the upper dining area and their hospitality continued throughout the meal. While it wasn’t over the top like the lower level, it is still so beautiful with amazing views of the river. We went for a Sunday brunch and tried a number of different things. You can taste the grill and char on that beef kebab which I appreciated as a true Iowan raised on good beef. The short rib hash was easily my favorite. All of the different flavors and ingredients were so different and unlike so many other offerings. The salmon benedict was fairly traditional, yet delicious, whereas the breakfast gnocchi was super unique, but equally divine.  The only thing I will say is that I can’t wait for the next time I’m in town so I can go here for happy hour, dinner, and/or drinks.     </div>`)[0];

                var html_2d3ba1caf424fe3df137c0db7e31e16a = $(`<div id="html_2d3ba1caf424fe3df137c0db7e31e16a" style="width: 100.0%; height: 100.0%;">     <b>Siena Tavern</b><br>     <b>Date:</b> 2026-01-06<br><br>     ⭐⭐⭐⭐☆  We stopped by **Sierra Tavern** during happy hour and honestly had a great time—exactly the kind of experience that makes you say, *“Yep, we’ll be back.”*  We started with the **Burnt Pepperoni**—tomato sauce, mozzarella, and red chiles. It leaned a bit on the greasy side, but in a very intentional, indulgent way. Bold, flavorful, and absolutely worth it, especially paired with a drink.  The real standout, though, was the **Sea Bass Milanese** with lemon caper aioli—spectacular. Perfectly crisp on the outside, tender and flaky inside, and that aioli brought everything together with just the right balance of brightness and richness. It’s the kind of dish that quietly steals the show.  We also tried the **Mini Tavern Burger** with truffle aioli, balsamic caramelized onions, arugula, and fontina—solid, satisfying, and well-balanced. Small but mighty, and packed with flavor.  Drinks were on point too. The **Espresso Martini** (vanilla vodka, Kahlúa, espresso) was smooth, not overly sweet, and dangerously easy to drink—especially at **$9**. The **Strawberry Spritz** (vodka, strawberry, lemon, brut) was light, refreshing, and equally delicious.  We sat at the bar, the service was friendly and attentive without being intrusive, and the overall vibe was relaxed and enjoyable. A great happy hour spot and definitely a place we’ll be returning to.     </div>`)[0];

                var html_c374ba00ea8a2297360e0f702ab99c10 = $(`<div id="html_c374ba00ea8a2297360e0f702ab99c10" style="width: 100.0%; height: 100.0%;">     <b>Carnivale Chicago</b><br>     <b>Date:</b> 2025-12-28<br><br>     Carnival is not just dinner.... it’s a full-on experience!!  Walking in feels like stepping into another world. The lights, the music, the energy — everything is vibrant, bold, and alive. This is the kind of place where the night instantly feels exciting before you even sit down.  The food is just as fun as the atmosphere. Colorful, creative, and packed with flavor, every dish feels like part of the show. Even on a lighter visit, everything we tried was memorable and beautifully done. And the drinks? Unreal. Playful, dramatic, and absolutely part of the experience (cotton candy cocktails included).  What really sets Carnival apart is the vibe — it’s loud in the best way, social, celebratory, and perfect for date night, group dinners, or any night you want to feel like you’re out out. It’s not a quiet meal — it’s a party, and that’s exactly the point.  If you’re looking for a restaurant that’s immersive, energetic, and genuinely fun, Carnival Chicago delivers. One of the most entertaining dining experiences I’ve had in the city!!     </div>`)[0];

                var html_613c3f2f5ad432420e30ce457b940190 = $(`<div id="html_613c3f2f5ad432420e30ce457b940190" style="width: 100.0%; height: 100.0%;">     <b>The Publican</b><br>     <b>Date:</b> 2026-03-02<br><br>     So, a group of my restaurant friends and I decided to visit this establishment. We couldnt find the door at first, but once we did, we were welcomed by Sofia, a manager with the widest smile imaginable! We were seated and our server, Savanna had an even wider smile and service that complimented the place. The bus service was prompt and equally matched to our server. The coordination beyween the two was superb. The food here is fresh, the ham and cheese sandwich, fresh ham with a wonderfully balanced Gruyere cheese was marvelous. The coffee was hot for 12oclock lunch. This place reviews discuss the food, but as the food we tasted was very good, the staff deserves a place of honor and acknowledgement. Sofia, Savanna, Todd, and the bartender, thank you for a WONDERFUL experience.  When you come to Chicago folks, please pay the Publican a visit... there's also a Publican meat market directly across the street for some fine cuts of meat.     </div>`)[0];

                var html_c3fd08dab667bd981e327028a0748a2c = $(`<div id="html_c3fd08dab667bd981e327028a0748a2c" style="width: 100.0%; height: 100.0%;">     <b>The Publican</b><br>     <b>Date:</b> 2026-01-04<br><br>     The Publican is a self-proclaimed homage to European beer halls and every part of the experience commits to that idea. The space felt lively and communal, with long thick wooden tables and high ceiling. Casual and energetic, it's the ideal place for dinner and some drinks with your friends. The food followed suit: no frills, no smoke and mirrors, just generous portions of satisfying, well-executed dishes. Their farm-to-table menu is ever-changing with a few staples, all of which are approachable and comforting. We’ve worked our way through a lot of their offerings, and everything consistently ranges from solid to great. We can never skip the oysters or the pork rinds and the chicken entrée is always so tough to pass up. A night out at The Publican always feels like a throwback to simpler times: casual, unfussy, and all about good company.     </div>`)[0];

                var html_d763115c66922e8d9b2b1e54a2a00be7 = $(`<div id="html_d763115c66922e8d9b2b1e54a2a00be7" style="width: 100.0%; height: 100.0%;">     <b>The Publican</b><br>     <b>Date:</b> 2026-05-27<br><br>     My husband and I came in to celebrate our anniversary and had an incredible experience all around. Being people who are more wine-centric I took a look at the the wine list before coming and, although the list had some delicious options that we knew, we were looking for something a bit more special than what they had to offer so brought our own bottle and opted to pay the corkage ($30). In looking at the wine list I discovered that they are known for their beer so we each started with different beers before moving to our wine and were both very pleased with what we received. Our server had a great energy,  table side manner, and was more than happy to walk us through the menu and offer her suggestions. After our initial look over the menu we were going to go with dishes other than our servers suggestions but ultimately trusted the pro and ended up being incredible happy that we did. We started with the Duck and Pork Rillettes and the Beef Fat Fries and both were delicious. Then we moved into the Mussels, which were super meaty, and we agreed were the best we have ever had. Both the Mussels and Rillettes came with a healthy portion of bread which we were really happy with. For our entree we split the Ham Chop in Hay, which our serve recommended, and it ended up being our favorite dish of the evening. Smokey, tender, and melted in your mouth. Would highly recommend to anyone! For dessert we split the 'Kyle's After Pork' dessert cocktail and it was super interesting and really delicious. Truly a great experience overall, highly recommend to anyone interested, and cannot wait to come back with a group to try the Suckling Pig!     </div>`)[0];

                var html_35e18bf33ac21f1b00b43d64a23bd9f8 = $(`<div id="html_35e18bf33ac21f1b00b43d64a23bd9f8" style="width: 100.0%; height: 100.0%;">     <b>Boka</b><br>     <b>Date:</b> 2026-05-26<br><br>     Boka has been a Chicago staple since opening in 2003, earning a Michelin star and becoming one of the city’s most celebrated restaurants. Led by Chef Lee Wolen, whose cooking is refined yet approachable, the menu blends creativity with comforting flavors in a way that feels effortless. Boka — very hip, polished, and completely on point. The atmosphere is laid back with dimmed lighting and eclectic decor that gives the space a cool, modern energy without feeling overly formal. Surprisingly kid-friendly too, with coloring books and simple options for children, which made the experience even better. On a Saturday evening, the restaurant was bustling with fun energy and a stylish local crowd. Favorite dishes:• Hokkaido scallops• Tuna tartare• Char• Truffle chicken• Walnut chocolate cake  Overall, Boka strikes the perfect balance between elevated dining and a warm, welcoming atmosphere — the kind of place that feels equally suited for a special night out or a relaxed dinner with family and friends.     </div>`)[0];

                var html_63c536da7b46f299ddeda97cf03dd14b = $(`<div id="html_63c536da7b46f299ddeda97cf03dd14b" style="width: 100.0%; height: 100.0%;">     <b>Boka</b><br>     <b>Date:</b> 2026-02-10<br><br>     I’ve heard and read great reviews about Boka for years, so I was excited to finally secure a reservation on the last day of Restaurant Week. Unfortunately, from the moment we walked in, the experience was very disappointing. Only one member of the front staff was friendly; the rest had an unpleasant demeanor. Throughout the evening, I felt unwelcome and rushed. We were seated in a crowded section of the restaurant—where all the RW guests were placed—while other areas appeared noticeably more spacious and "had more time".  I also expected exceptional food with a “wow wow-wee wow” factor from a Michelin-starred restaurant. Unfortunately, those expectations weren't met. All the dishes were under-seasoned, and the hot courses were served at room temperature. The roasted scallops and the miso caramel brownie were the only dishes I enjoyed. The portions were extremely small and expensive, especially considering the food quality, atmosphere, and service I would expect from a Michelin Star ⭐.  Since the RW menu wasn't presented at its best, I have no interest in trying the regular menu. Overall, the experience and reviews were overhyped and not worth the price! I would recommend saving your money, dining somewhere with a more welcoming atmosphere, and greater care put into both service and food. I do NOT recommend! Period.     </div>`)[0];

                var html_1ce3dccc9eaa7b43ff83368203560e2f = $(`<div id="html_1ce3dccc9eaa7b43ff83368203560e2f" style="width: 100.0%; height: 100.0%;">     <b>Boka</b><br>     <b>Date:</b> 2026-04-24<br><br>     We made a last-minute reservation for our anniversary dinner and were pleasantly surprised when the restaurant called to confirm and asked how many years we were celebrating — a small but thoughtful touch they used to personalize our experience. Rather than the tasting menu, we chose à la carte. The meal began with their sunflower seed bread roll, freshly baked with seeds that brought out incredible flavor, paired with a homemade butter cream that was a perfect match. Starters of tuna tart and chicken liver mousse were both beautifully executed — the mousse notably free of the gamey bitterness that comes from poor handling, with caramelized citrus balancing it perfectly. The scallops were decent but the pickled cucumber felt little overpowering, masking the scallop’s natural sweetness. The roasted veal sweetbreads, however, were the highlight of the night — incredibly tender, paired with chestnut mushrooms and a deeply flavored sauce. The duck and pork loin were both well-prepared, though perhaps not as memorable as one might expect at Michelin star level. Dessert was a standout — a brownie-style black walnut chocolate cake, rich yet balanced with cream and ice cream, finished with a butterscotch sauce that added a perfect kick. The complimentary chocolate truffles were equally impressive. Overall a wonderful evening. Elegant setting, genuine Michelin-level service, and enough dishes that truly shone to make it well worth a visit.     </div>`)[0];
